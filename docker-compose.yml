services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricedrop
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pricedrop']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pricedrop
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
