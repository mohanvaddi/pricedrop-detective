services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricedrop
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pricedrop']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs Drizzle migrations before the app starts.
  # If migrations fail this service exits non-zero and app never starts.
  migrate:
    build: .
    command: tsx shared/src/db/migrate.ts
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pricedrop
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Express API + Telegram/Reddit bots + notification-queue poller.
  # Delegates all scraping to the scrapers service over HTTP (SCRAPER_URL).
  app:
    build: .
    command: tsx server/server.ts
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pricedrop
      SCRAPER_URL: http://scrapers:5001
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Standalone scraper service: HTTP /scrape for on-demand adds + an in-process
  # cron (node-cron) that runs runBatch() every minute for due products.
  # Replaces the old alpine `cron` container.
  scrapers:
    build: .
    command: tsx scrapers/src/index.ts
    ports:
      - '5001:5001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pricedrop
      SCRAPER_PORT: '5001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:5001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres_data:
